# Double-blind configuration. NOT shipped in the supplement -- listing the
# author's name inside a file the reviewer reads would defeat the purpose, which
# is exactly what the first version of this check did.
#
# `needles` are regexes that must not survive into the submitted PDF or the
# supplement. `allowed` are patterns that look identifying but name a public
# artifact instead (the datasets, the model fork, the libraries) -- those are
# required for reproduction and are not de-anonymising.
# `substitutions` are applied to files on their way into the supplement archive,
# so the committed provenance records stay truthful while the shipped copy is
# anonymous.

needles:
  - 'Ian\s+Poon'
  - 'ian_poon'
  - '@fas\.harvard'
  - '\bHarvard\b'
  - 'Cellular and Molecular Biology'
  - '/home/[a-z0-9_.-]+/'
  - 'github\.com/extremefattypunch'
  - 'HPCxBIO-journal-collab'

allowed:
  - 'zenodo\.org'
  - 'arxiv\.org'
  - 'doi\.org'
  - 'github\.com/ACEsuit'
  - 'github\.com/beckobert'   # the multi-head-committee MACE fork the paper cites
  - 'github\.com/e3nn'
  - 'github\.com/pytorch'
  - 'anonymous\.4open\.science'   # the anonymised artifact mirror
  - 'proceedings\.neurips\.cc'    # bibliography: official NeurIPS proceedings
  - 'openreview\.net'              # bibliography: official ICLR record
  - 'neurips\.cc'                 # the NeurIPS checklist template embeds its own
                                  # policy URLs (code submission, ethics guidelines)

substitutions:
  - pattern: '-e git\+https://github\.com/extremefattypunch/[^\s]+'
    replace: '-e .   # this project, installed editable (repo withheld for review)'
  - pattern: '/home/[a-z0-9_.-]+/src/mace-mhc'
    replace: '<local-checkout>/mace-mhc'
  - pattern: 'file:///home/[a-z0-9_.-]+/[^\s]*'
    replace: 'file://<build-path>'
  - pattern: '/home/[a-z0-9_.-]+/'
    replace: '<path>/'
